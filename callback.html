<!doctype html>
<html lang="es">
<!-- Adaptado de GSync (https://github.com/dg0988/ObsidianGSync), licencia MIT, Copyright (c) 2026 dg0988. Lógica sin cambios; solo textos en español. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Obsidian GSync · inicio de sesión</title>
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --fg:#1d1d1f; --muted:#6b6b70; --accent:#7c3aed; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1b1f; --fg:#f2f2f4; --muted:#a0a0a8; --accent:#a78bfa; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 28rem; padding: 2rem 1.5rem; text-align:center; }
  h1 { font-size: 1.4rem; margin: 0 0 .75rem; }
  p { color: var(--muted); line-height: 1.5; }
  .btn { display:inline-block; margin-top:1rem; padding:.85rem 1.5rem; border-radius:.6rem;
         background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Volviendo a Obsidian…</h1>
  <p id="msg">Si Obsidian no se abre solo, pulsa el botón.</p>
  <a id="open" class="btn" href="#">Abrir Obsidian</a>
  <p><small>Esta página solo entrega a GSync, en tu propio dispositivo, el código temporal de inicio de sesión de Google. No guarda ni envía nada a ningún otro lugar. <a href="privacy.html">Privacidad</a></small></p>
</main>
<script>
(function () {
  var q = new URLSearchParams(window.location.search);
  var code = q.get("code"), state = q.get("state") || "", error = q.get("error");
  var title = document.getElementById("title"), msg = document.getElementById("msg"), btn = document.getElementById("open");

  if (!code && !error) {
    title.textContent = "Obsidian GSync · inicio de sesión";
    msg.textContent = "No hay nada que hacer aquí. Inicia sesión desde los ajustes de GSync en Obsidian.";
    btn.classList.add("hidden");
    return;
  }

  // The vault name is carried in the state after "~" (base64url) so the right vault opens.
  var vault = "";
  var i = state.indexOf("~");
  if (i >= 0) {
    try {
      var b = state.slice(i + 1).replace(/-/g, "+").replace(/_/g, "/");
      while (b.length % 4) b += "=";
      var bin = atob(b), bytes = new Uint8Array(bin.length);
      for (var k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
      vault = new TextDecoder().decode(bytes);
    } catch (e) { vault = ""; }
  }

  var parts = [];
  if (vault) parts.push("vault=" + encodeURIComponent(vault));
  if (code) parts.push("code=" + encodeURIComponent(code));
  if (state) parts.push("state=" + encodeURIComponent(state));
  if (error) parts.push("error=" + encodeURIComponent(error));
  var url = "obsidian://gsync-auth?" + parts.join("&");

  btn.href = url;
  if (error) {
    title.textContent = "Se canceló el inicio de sesión";
    msg.textContent = "Google respondió: " + error + ". Vuelve a Obsidian e inténtalo de nuevo.";
  }
  // Remove the code from the address bar and history.
  try { history.replaceState(null, "", window.location.pathname); } catch (e) {}
  setTimeout(function () { window.location.href = url; }, 300);
})();
</script>
</body>
</html>
